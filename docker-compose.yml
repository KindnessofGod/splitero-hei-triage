services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hei
      POSTGRES_PASSWORD: hei
      POSTGRES_DB: hei_triage
    ports:
      - '5433:5432'
    volumes:
      # Migrations run automatically on first start, in filename order.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - hei_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hei -d hei_triage']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  hei_pgdata:
